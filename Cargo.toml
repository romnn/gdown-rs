[workspace]
resolver = "3"
members = ["crates/gdown", "crates/gdown-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/romnn/gdown-rs"

[profile.release]
lto = "fat"
codegen-units = 1
# Nothing catches panics, so unwinding code would only cost speed and size.
panic = "abort"

[workspace.lints.rust]
warnings = { level = "warn", priority = -1 }
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
missing_errors_doc = "warn"
await_holding_lock = "deny"
# A module with submodules lives in foo/mod.rs, never in foo.rs beside a foo/ directory.
self_named_module_files = "deny"
# Every #[allow] must carry a reason = "...".
allow_attributes_without_reason = "deny"

# Allowed
map_unwrap_or = "allow"
assigning_clones = "allow"
struct_excessive_bools = "allow"

[workspace.metadata.cargo-fc]
install_missing_targets = true
dedupe = true
aggregate_targets = false
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-gnu",
  "aarch64-apple-darwin",
]

[workspace.metadata.cargo-fc.subcommands.lint]
# A warning on any target fails the lint run, while builds and tests keep warnings as warnings.
pedantic = true

[workspace.metadata.cargo-fc.subcommands.udeps]
maximal_features = true
