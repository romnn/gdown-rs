[package]
name = "gdown"
version = "0.1.0"
edition = "2021"
description = "Download files and folders from Google Drive shared links"
license = "MIT"

[lib]
name = "gdown"
path = "src/lib.rs"

[[bin]]
name = "gdown"
path = "src/main.rs"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
indexing_slicing = "deny"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
flate2 = "1"
indicatif = "0.18"
regex = "1"
reqwest = { version = "0.13", features = ["blocking", "cookies"] }
scraper = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
url = "2"
urlencoding = "2"
zip = "7"
filetime = "0.2"
digest = "0.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
