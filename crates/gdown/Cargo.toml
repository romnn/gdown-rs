[package]
name = "gdown"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Download files and folders from Google Drive shared links"

[lints]
workspace = true

[dependencies]
bzip2 = "0.6"
flate2 = "1"
indicatif = "0.18"
regex = "1"
reqwest = { version = "0.13", features = ["cookies"] }
scraper = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "io-std", "time", "sync"] }
tracing = "0.1"
url = "2"
urlencoding = "2"
zip = "8"

[dev-dependencies]
color-eyre = "0.6"
flate2 = "1"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
zip = "8"
